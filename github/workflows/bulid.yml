name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install buildozer
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk

      - name: Create buildozer.spec
        run: |
          printf '[app]\ntitle = Standoff 2 Private\npackage.name = standoff2private\npackage.domain = org.standoff\nversion = 2.0\nsource.dir = .\nsource.include_exts = py,png,jpg,ttf,db\nrequirements = python3,kivy\norientation = portrait\nfullscreen = 1\nandroid.api = 34\nandroid.minapi = 21\nandroid.permissions = INTERNET\n\n[buildozer]\nlog_level = 2\n' > buildozer.spec

      - name: Build APK
        run: buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: standoff-apk
          path: bin/*.apk
