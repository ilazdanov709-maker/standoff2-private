name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install buildozer
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk

      - name: Create buildozer.spec
        run: |
          cat > buildozer.spec << 'EOF'
          [app]
          title = Standoff 2 Private
          package.name = standoff2private
          package.domain = org.standoff
          version = 2.0
          source.dir = .
          source.include_exts = py,png,jpg,ttf,db
          requirements = python3,kivy
          orientation = portrait
          fullscreen = 1
          android.api = 34
          android.minapi = 21
          android.permissions = INTERNET

          [buildozer]
          log_level = 2
          EOF

      - name: Build APK
        run: buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: standoff-apk
          path: bin/*.apk
